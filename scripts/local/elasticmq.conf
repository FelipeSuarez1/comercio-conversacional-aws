# Configuração do ElasticMQ (emulador local do SQS).
# Cria a fila `pedidos` e a DLQ `pedidos-dlq`, com os mesmos parâmetros da AWS
# (ver docs/contratos.md).

include classpath("application.conf")

# Endereço usado nas URLs das filas. Com host = sqs, a URL fica
# http://sqs:9324/000000000000/pedidos, igual a FILA_PEDIDOS_URL do contrato.
node-address {
  protocol = http
  host = sqs
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

aws {
  region = us-east-1
  accountId = 000000000000
}

queues {
  pedidos {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "pedidos-dlq"
      maxReceiveCount = 3
    }
  }

  pedidos-dlq {}
}
